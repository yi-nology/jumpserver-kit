name: CI

on:
  push:
    branches: [main, master]
    # ⚠️ **tag 也要跑 CI**：打出去的 tag 必须**能编译**。
    #   踩过的坑：v0.3.0 是在 CI 还红的时候打的 ⇒ 那个 tag 缺一个源码文件
    #   （.gitignore 的 `coverage.*` 把同名源码吞了）⇒ `go install ...@v0.3.0`
    #   直接编译失败，而**没有一个人收到通知**。
    #   ⇒ tag 一推就跑一遍 CI ⇒ tag 坏了会当场红。
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# GOPRIVATE:github.com/oagentkit/* —— 自家模块系列(guardx 等)不走公开代理与
# checksum DB,直接从 GitHub 取:第三方代理不参与自家模块的分发。
#
# ⚠️ 前提:这些仓当前是**公开**的,直连走匿名 HTTPS 即可;GOPRIVATE 同时会让 Go
#    跳过 checksum DB(go.sum 的哈希校验仍然生效)。
#    若将来 oagentkit 转私有,本 workflow 的 checkout 用了 persist-credentials: false
#    (不保留 git 凭据),届时必须改成保留凭据,否则直连拉取会失败。
env:
  GOPRIVATE: github.com/oagentkit/*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ⚠️ 跨仓守卫需要**三棵树同时在手**:底座不得依赖服务(跨 module path)、
    # 底座的包必须被两个服务都用(可达性要穿过两个服务仓的 import 图)、
    # 共用词汇必须真被产出(产出者在服务仓里)、能力的措辞不许在别处重写。
    #
    # ⇒ 缺兄弟仓 ⇒ 守卫**跳过** ⇒ 跳过 ≠ 通过 ⇒ JMS_REQUIRE_SIBLINGS=1 让它变红。
    #
    # ⚠️ 先后依赖:两个服务仓必须**先在 GitHub 上存在**,否则这里的 checkout 直接失败。
    #   (推的顺序:先建三个仓 → 推 kit 并打 v0.1.0 tag → 推两个服务仓。)
    env:
      JMS_REQUIRE_SIBLINGS: "1"
      JMS_SIBLING_ROOTS: ${{ github.workspace }}/jumpserver-mgmt:${{ github.workspace }}/jumpserver-exec

    steps:
      # ⚠️ 本仓 checkout 到 kit/ 子目录 ⇒ 它的兄弟目录正好是 ../jumpserver-mgmt 与
      #   ../jumpserver-exec —— 与 pkg/arch.SiblingRoots 的同级目录约定一致。
      - name: Checkout kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: kit
          persist-credentials: false

      - name: Checkout management plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yi-nology/jumpserver-mgmt
          path: jumpserver-mgmt
          persist-credentials: false

      - name: Checkout execution plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yi-nology/jumpserver-exec
          path: jumpserver-exec
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: kit/go.mod
          cache: true
          cache-dependency-path: kit/go.sum

      - name: Check formatting
        working-directory: kit
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download dependencies
        working-directory: kit
        run: go mod download

      - name: Run vet
        working-directory: kit
        run: go vet ./...

      - name: Build
        working-directory: kit
        run: go build ./...

      - name: Run tests
        working-directory: kit
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: kit/coverage.out
        # ⚠️ 需要仓库侧配好 codecov 才能上传成功;没配时**不要**让这一条把整个 CI 拉红。
        continue-on-error: true

  # ---- 守卫的牙齿：变异验证每次 CI 都自证一遍 ------------------------------
  #
  # ⚠️ 为什么单独一个 job：变异脚本把「规则实现退回旧行为」，看守卫测试
  #   会不会变红。它们只在**有人记得跑**的时候才有意义 —— 手工跑过几轮
  #   之后就有了退化的空间（守卫悄悄变哑，没人发现）。接进 CI 让「牙齿
  #   是真的」成为每次 push 的事实，不是某次人工验证的记忆。
  # ⚠️ 版本守卫跨三个仓（委派调用点在管理面、反门禁在执行面）⇒ 三棵树
  #   都要在手，与 Test job 同一套 checkout。
  mutations:
    name: Guard mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JMS_SIBLING_ROOTS: ${{ github.workspace }}/jumpserver-mgmt:${{ github.workspace }}/jumpserver-exec
    steps:
      - name: Checkout kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: kit
          persist-credentials: false

      # ⚠️ 变异验证 15 分钟起步，但守卫没变时结果不可能变。只在动到守卫
      #   相关路径时跑；tag 全量跑（发版即全量验证一次）。判断不出来的
      #   情况（branch 创建、diff 失败）按「跑」处理——跳过必须是确信的。
      - name: Decide whether the guards could have changed
        id: filter
        working-directory: kit
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          changed=$(git diff --name-only "$RANGE" 2>/dev/null) || { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if echo "$changed" | grep -qE '(^|/)(pkg/arch|internal/arch|pkg/contractscan|pkg/reg|pkg/risk|pkg/audit|pkg/redact)/|script/mutate-|idl/|\.github/workflows/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout management plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yi-nology/jumpserver-mgmt
          path: jumpserver-mgmt
          persist-credentials: false

      - name: Checkout execution plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yi-nology/jumpserver-exec
          path: jumpserver-exec
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: kit/go.mod
          cache: true
          cache-dependency-path: |
            kit/go.sum
            jumpserver-mgmt/go.sum
            jumpserver-exec/go.sum

      # ⚠️ 变异脚本在副本里跑 `go test` 用的是 GOPROXY=off（见各脚本的
      #   run_one）⇒ 依赖必须**先**进 module cache，否则变异还没开始就先
      #   栽在「依赖解析不出去」上 —— 那也是一种红，但什么也证明不了。
      - name: Download dependencies
        if: steps.filter.outputs.run == 'true'
        run: |
          go mod download
          (cd jumpserver-mgmt && go mod download)
          (cd jumpserver-exec && go mod download)

      - name: Run mutation sweeps
        if: steps.filter.outputs.run == 'true'
        working-directory: kit
        # 逐个跑、任何一个非零即红；每个脚本先跑 canary 自证 overlay 生效，
        # 所以「全绿」不是「没跑成」——canary 红了那一轮直接不算数。
        run: |
          for s in script/mutate-*.py; do
            echo "=== $s ==="
            python3 "$s" || exit 1
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: kit
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: kit/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: kit
        # ⚠️ 默认规则集还没在本仓调过 ⇒ 先**报告**不阻断;调好之后去掉这一行。
        continue-on-error: true

  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: kit
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-file: kit/go.mod
          work-dir: kit
